<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Console — Last Benchers Association</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3D66E8; --pink:#F61AA8; --bg-pink:#F8C9D9; --ink:#0F1115; --ink-soft:#5B5F72;
  --paper:#fff; --paper-alt:#FCEEF4; --line:#E9D8DF; --radius:12px;
  --shadow:0 6px 20px rgba(61,102,232,.08); --gradient:linear-gradient(135deg,var(--blue),var(--pink));
  --font:'Inter',sans-serif; --display:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0; font-family:var(--font); background:var(--paper-alt); color:var(--ink);}
a{color:inherit; text-decoration:none;}
button{font-family:var(--font); cursor:pointer;}
img{max-width:100%;}
h1,h2,h3{font-family:var(--display);}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed; inset:0; background:radial-gradient(circle at 20% 20%,#1b2140,var(--ink)); display:flex; align-items:center; justify-content:center; z-index:500;}
.login-card{background:#fff; border-radius:18px; padding:2.5rem 2.2rem; width:100%; max-width:380px; box-shadow:0 30px 70px rgba(0,0,0,.4);}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:1.5rem;}
.login-brand .crest{width:44px; height:44px; border-radius:12px; background:var(--gradient); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:.8rem;}
.login-card h1{font-size:19px; margin:0;}
.login-card p{color:var(--ink-soft); font-size:12.5px; margin:2px 0 0;}
.login-card input{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:14px; font-size:14.5px; font-family:var(--font);}
.login-card input:focus{outline:none; border-color:var(--pink);}
.login-card button{width:100%; padding:12px; border-radius:10px; border:none; background:var(--gradient); color:#fff; font-weight:700; font-size:14.5px; font-family:var(--display);}
.login-err,.login-warn{font-size:13px; margin-bottom:14px; padding:10px 12px; border-radius:8px; display:none;}
.login-err{color:#C0392B; background:#fdecec; border:1px solid #f3c2c2;}
.login-warn{color:#92600a; background:#fff6e0; border:1px solid #f2d98b;}

/* ---------- SHELL ---------- */
#app{display:none;}
.shell{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
.sidebar{background:var(--ink); color:#fff; padding:20px 14px; display:flex; flex-direction:column;}
.sb-brand{display:flex; align-items:center; gap:10px; padding:4px 10px 20px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:14px;}
.sb-brand .crest{width:34px; height:34px; border-radius:9px; background:var(--gradient); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:.68rem; flex-shrink:0;}
.sb-brand .name{font-family:var(--display); font-weight:700; font-size:14px; line-height:1.25;}
.sb-brand .tag{font-family:var(--mono); font-size:.6rem; color:var(--pink); text-transform:uppercase; letter-spacing:.05em;}
.sb-item{display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:9px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,.6); cursor:pointer; margin-bottom:2px;}
.sb-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-item.active{background:var(--gradient); color:#fff;}
.sb-icon{width:18px; text-align:center; font-family:var(--mono); font-size:.85rem;}
.sb-bottom{margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.1);}

.main{padding:24px 30px; overflow-y:auto;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.topbar h2{margin:0; font-size:21px;}
.topbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
.topbar-actions{display:flex; gap:10px;}

.cards-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px;}
.stat-card{background:#fff; border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); border:1px solid var(--line);}
.stat-card .num{font-size:26px; font-weight:800; font-family:var(--display); background:var(--gradient); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat-card .lbl{color:var(--ink-soft); font-size:11.5px; margin-top:3px; text-transform:uppercase; letter-spacing:.04em; font-family:var(--mono);}

.panel{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); padding:22px; margin-bottom:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.panel-head h3{margin:0; font-size:16px;}
.panel-head .hint{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}

.btn{display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:9px; border:none; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--display);}
.btn-primary{background:var(--gradient); color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:var(--paper-alt); color:var(--ink);}
.btn-danger{background:#fdecec; color:#C0392B;}
.btn-sm{padding:6px 12px; font-size:12px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; padding:9px 11px; color:var(--ink-soft); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; font-family:var(--mono); border-bottom:1.5px solid var(--line);}
td{padding:11px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.thumb-sm{width:42px; height:42px; border-radius:7px; object-fit:cover; background:var(--paper-alt);}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; font-family:var(--mono);}
.badge-on{background:#e5f3ec; color:#1F9660;}
.badge-off{background:#f1f1f1; color:#888;}
.badge-status{background:var(--bg-pink); color:#E01097; text-transform:capitalize;}
.row-actions{display:flex; gap:8px;}
.empty-row{text-align:center; color:var(--ink-soft); padding:26px; font-size:13px;}

.toggle{position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0;}
.toggle input{opacity:0; width:0; height:0;}
.toggle .slider{position:absolute; cursor:pointer; inset:0; background:#ddd; border-radius:999px; transition:.2s;}
.toggle .slider:before{content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.toggle input:checked + .slider{background:var(--gradient);}
.toggle input:checked + .slider:before{transform:translateX(16px);}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(15,17,21,.55); display:none; align-items:center; justify-content:center; z-index:400; padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 30px 60px rgba(0,0,0,.3);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--line);}
.modal-head h3{margin:0; font-size:17px;}
.modal-close{background:none; border:none; font-size:22px; color:var(--ink-soft); cursor:pointer;}
.modal-body{padding:22px 24px; display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; margin-bottom:6px; color:var(--ink-soft); font-family:var(--mono);}
.field input,.field select,.field textarea{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-family:var(--font);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--pink);}
.field textarea{min-height:80px; resize:vertical;}
.field-row{display:flex; gap:12px;}
.field-row > *{flex:1;}
.upload-toggle{display:flex; gap:8px; margin-bottom:6px;}
.upload-toggle button{flex:1; padding:8px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper-alt); font-size:12px; font-weight:700; font-family:var(--mono);}
.upload-toggle button.active{background:var(--gradient); color:#fff; border-color:transparent;}
.file-hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
.modal-foot{padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:13px 19px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); z-index:600; display:none; font-family:var(--mono);}
.toast.err{background:#C0392B;}
.preview-img{max-height:110px; border-radius:8px; margin-top:6px; display:none;}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:18px;}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <span class="crest">&lt;LBA/&gt;</span>
      <div><h1>Admin Console</h1><p>Last Benchers Association</p></div>
    </div>
    <div class="login-warn" id="apiWarn">Set <code>API_URL</code> at the top of this file before logging in.</div>
    <div class="login-err" id="loginErr"></div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Log In</button>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="sb-brand">
        <span class="crest">&lt;LBA/&gt;</span>
        <div><div class="name">Admin Console</div><div class="tag">LBA Studio</div></div>
      </div>
      <div class="sb-item active" data-view="dashboard"><span class="sb-icon">▣</span>Dashboard</div>
      <div class="sb-item" data-view="services"><span class="sb-icon">&lt;/&gt;</span>Services</div>
      <div class="sb-item" data-view="portfolio"><span class="sb-icon">◧</span>Portfolio</div>
      <div class="sb-item" data-view="gallery"><span class="sb-icon">▤</span>Gallery</div>
      <div class="sb-item" data-view="clients"><span class="sb-icon">◈</span>Clients</div>
      <div class="sb-item" data-view="testimonials"><span class="sb-icon">"</span>Testimonials</div>
      <div class="sb-item" data-view="enquiries"><span class="sb-icon">✉</span>Enquiries</div>
      <div class="sb-item" data-view="settings"><span class="sb-icon">⚙</span>Settings</div>
      <div class="sb-bottom">
        <a class="sb-item" href="index.html" target="_blank"><span class="sb-icon">↗</span>View Site</a>
        <div class="sb-item" id="logoutBtn"><span class="sb-icon">⏻</span>Log Out</div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div><h2 id="viewTitle">Dashboard</h2><div class="sub" id="viewSub">Overview of your website</div></div>
      </div>
      <div id="viewContent"></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ================= MODAL (shared) ================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Add Item</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — same /exec URL as index.html
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxnV7D9f81LT3VsKweC6eJdttW8RtwUk3x_D8t5nNA5kiolLCwyo9sxzc8zacicSmo/exec";
let TOKEN = sessionStorage.getItem('lba_admin_token') || '';
let ADMIN = null; // last-loaded adminData payload

/* ---------- API layer — plain fetch, text/plain POST body to skip CORS preflight ---------- */
function apiGet(action, params) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('token', TOKEN);
  Object.keys(params || {}).forEach(function (k) { if (params[k] !== undefined) url.searchParams.set(k, params[k]); });
  return fetch(url.toString()).then(function (r) { return r.json(); })
    .catch(function (err) { return { ok: false, error: 'Network error: ' + err.message }; });
}
function apiPost(action, payload) {
  return fetch(API_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, payload))
  }).then(function (r) { return r.json(); }).catch(function (err) { return { ok: false, error: 'Network error: ' + err.message }; });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function fmtDate(d) { const dt = new Date(d); return isNaN(dt) ? '' : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : '');
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 3000);
}
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result.split(',')[1]); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* =========================================================
   AUTH
   ========================================================= */
if (!API_URL) document.getElementById('apiWarn').style.display = 'block';

function showLogin() { document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('app').style.display = 'none'; }
function showApp() { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('app').style.display = 'block'; renderView('dashboard'); }

document.getElementById('loginBtn').onclick = function () { doLogin(); };
document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
function doLogin() {
  if (!API_URL) return;
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Logging in…'; btn.disabled = true;
  apiPost('login', { username: user, password: pass }).then(function (res) {
    btn.textContent = 'Log In'; btn.disabled = false;
    if (res && res.ok) {
      TOKEN = res.token;
      sessionStorage.setItem('lba_admin_token', TOKEN);
      showApp();
    } else {
      document.getElementById('loginErr').style.display = 'block';
      document.getElementById('loginErr').textContent = (res && res.error) || 'Login failed';
    }
  });
}
document.getElementById('logoutBtn').onclick = function () {
  apiPost('logout', {});
  sessionStorage.removeItem('lba_admin_token');
  TOKEN = '';
  showLogin();
};

(function initAuth() {
  if (!TOKEN) { showLogin(); return; }
  apiGet('checkSession', {}).then(function (res) { if (res && res.ok) showApp(); else showLogin(); });
})();

/* =========================================================
   SIDEBAR / ROUTING
   ========================================================= */
document.querySelectorAll('.sb-item[data-view]').forEach(function (item) {
  item.onclick = function () {
    document.querySelectorAll('.sb-item[data-view]').forEach(function (i) { i.classList.remove('active'); });
    item.classList.add('active');
    renderView(item.dataset.view);
  };
});

const VIEW_META = {
  dashboard: ['Dashboard', 'Overview of your website'],
  services: ['Services', 'What shows in the "What we do" section'],
  portfolio: ['Portfolio', 'Client project cards shown on the homepage'],
  gallery: ['Gallery', 'Photos shown in the gallery section'],
  clients: ['Clients', 'Logos/names in the "Trusted by" strip'],
  testimonials: ['Testimonials', 'Client reviews shown on the homepage'],
  enquiries: ['Enquiries', 'Messages from the homepage enquiry form'],
  settings: ['Settings', 'Site-wide content, contact details and section visibility']
};

function renderView(view) {
  document.getElementById('viewTitle').textContent = VIEW_META[view][0];
  document.getElementById('viewSub').textContent = VIEW_META[view][1];
  const c = document.getElementById('viewContent');
  c.innerHTML = '<div class="panel">Loading…</div>';
  loadAdminData().then(function () {
    ({
      dashboard: renderDashboard, services: function (c) { renderCrud(c, 'services'); },
      portfolio: function (c) { renderCrud(c, 'portfolio'); }, gallery: function (c) { renderCrud(c, 'gallery'); },
      clients: function (c) { renderCrud(c, 'clients'); }, testimonials: function (c) { renderCrud(c, 'testimonials'); },
      enquiries: renderEnquiries, settings: renderSettings
    })[view](c);
  });
}

function loadAdminData() {
  return apiGet('adminData', {}).then(function (res) {
    if (!res.ok) { toast(res.authError ? 'Session expired — please log in again.' : 'Failed to load data.', true); if (res.authError) showLogin(); return; }
    ADMIN = res;
  });
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(c) {
  if (!ADMIN) { c.innerHTML = '<div class="panel">Failed to load.</div>'; return; }
  const s = ADMIN.stats;
  c.innerHTML =
    '<div class="cards-row">' +
    statCard(s.portfolio, 'Portfolio Items') + statCard(s.services, 'Services') + statCard(s.gallery, 'Gallery Photos') +
    statCard(s.clients, 'Clients Listed') + statCard(s.testimonials, 'Testimonials') +
    statCard(s.enquiries, 'Total Enquiries') + statCard(s.newEnquiries, 'New Enquiries') +
    '</div>' +
    '<div class="panel"><h3 style="margin-top:0;">Quick tips</h3>' +
    '<p style="color:var(--ink-soft);font-size:13.5px;line-height:1.7;">' +
    'Use <strong>Settings</strong> to edit hero copy, contact details and turn whole sections of the site on or off. ' +
    'New enquiries appear under <strong>Enquiries</strong>. Image uploads are capped at 4&nbsp;MB — use a link instead for larger files.</p></div>';
}
function statCard(num, lbl) { return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'; }

/* =========================================================
   GENERIC CRUD MODULE  (services / portfolio / gallery / clients / testimonials)
   ========================================================= */
const CRUD_CONFIG = {
  services: {
    sheet: 'Services', label: 'Service', columns: ['icon', 'name'],
    fields: [
      { key: 'icon', label: 'Icon / Symbol (e.g. </>, { }, $, API)', type: 'text' },
      { key: 'name', label: 'Name', type: 'text' },
      { key: 'desc', label: 'Description', type: 'textarea' }
    ]
  },
  portfolio: {
    sheet: 'Portfolio', label: 'Project', columns: ['name', 'client', 'tag'],
    fields: [
      { key: 'name', label: 'Project Name', type: 'text' },
      { key: 'client', label: 'Client Name', type: 'text' },
      { key: 'tag', label: 'Category Tag (e.g. Web App)', type: 'text' },
      { key: 'desc', label: 'Description', type: 'textarea' },
      { key: 'tech', label: 'Tech Stack (comma separated)', type: 'text' },
      { key: 'image', label: 'Project Image', type: 'image' },
      { key: 'link', label: 'Link (optional)', type: 'text' }
    ]
  },
  gallery: {
    sheet: 'Gallery', label: 'Photo', columns: ['imageUrl', 'caption'], thumbCol: 'imageUrl',
    fields: [
      { key: 'image', label: 'Photo', type: 'image' },
      { key: 'caption', label: 'Caption (optional)', type: 'text' },
      { key: 'link', label: 'Link (optional)', type: 'text' }
    ]
  },
clients: {
  sheet: 'Clients', label: 'Client', columns: ['name', 'url'],
  fields: [
    { key: 'name', label: 'Client / Institution Name', type: 'text' },
    { key: 'image', label: 'Logo (upload or paste link)', type: 'image' },
    { key: 'url', label: 'Client Website (optional)', type: 'text' }
  ]
},
  
  testimonials: {
    sheet: 'Testimonials', label: 'Testimonial', columns: ['name', 'role', 'rating'],
    fields: [
      { key: 'name', label: 'Name', type: 'text' },
      { key: 'role', label: 'Role / Relationship', type: 'text' },
      { key: 'text', label: 'Testimonial Text', type: 'textarea' },
      { key: 'rating', label: 'Rating (1-5)', type: 'number' }
    ]
  }
};

function renderCrud(c, key) {
  const cfg = CRUD_CONFIG[key];
  c.innerHTML = panelShell(cfg.label + 's', 'Add ' + cfg.label);
  document.getElementById('addBtn').onclick = function () { openCrudModal(key); };
  loadCrudTable(key);
}
function panelShell(title, addLabel) {
  return '<div class="panel"><div class="panel-head"><h3>' + title + '</h3>' +
    '<button class="btn btn-primary" id="addBtn">+ ' + addLabel + '</button></div>' +
    '<div id="tableWrap"><div class="empty-row">Loading…</div></div></div>';
}

function loadCrudTable(key) {
  const cfg = CRUD_CONFIG[key];
  const rows = (ADMIN && ADMIN[key]) || [];
  const wrap = document.getElementById('tableWrap');
  if (!rows.length) { wrap.innerHTML = '<div class="empty-row">Nothing here yet — click "Add ' + cfg.label + '" to get started.</div>'; return; }

  const showThumb = !!cfg.thumbCol || cfg.fields.some(function (f) { return f.type === 'image'; });
  wrap.innerHTML = '<table><thead><tr>' + (showThumb ? '<th></th>' : '') +
    cfg.columns.map(function (col) { const f = cfg.fields.find(function (x) { return x.key === col || (x.key === 'image' && col === 'imageUrl'); }); return '<th>' + (f ? f.label.split(' (')[0] : col) + '</th>'; }).join('') +
    '<th>Order</th><th>Visible</th><th></th></tr></thead><tbody>' +
    rows.map(function (item) {
      const thumbSrc = item.imageUrl || item.image || '';
      return '<tr>' + (showThumb ? '<td>' + (thumbSrc ? '<img class="thumb-sm" src="' + esc(thumbSrc) + '">' : '') + '</td>' : '') +
        cfg.columns.map(function (col) { return '<td>' + esc(String(item[col] === undefined ? '' : item[col]).slice(0, 60)) + '</td>'; }).join('') +
        '<td>' + esc(item.sortOrder) + '</td>' +
        '<td><label class="toggle"><input type="checkbox" data-toggle="' + item.id + '" ' + (String(item.visible).toUpperCase() !== 'FALSE' ? 'checked' : '') + '><span class="slider"></span></label></td>' +
        '<td class="row-actions"><button class="btn btn-sm btn-ghost" data-edit="' + item.id + '">Edit</button>' +
        '<button class="btn btn-sm btn-danger" data-del="' + item.id + '">Delete</button></td></tr>';
    }).join('') + '</tbody></table>';

  wrap.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { openCrudModal(key, rows.find(function (r) { return String(r.id) === b.dataset.edit; })); }; });
  wrap.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = function () {
      if (!confirm('Delete this ' + cfg.label.toLowerCase() + '? This cannot be undone.')) return;
      apiPost('deleteItem', { sheet: cfg.sheet, id: b.dataset.del }).then(function (res) {
        if (res && res.ok) { toast('Deleted'); loadAdminData().then(function () { renderCrud(document.getElementById('viewContent'), key); }); }
        else toast((res && res.error) || 'Delete failed', true);
      });
    };
  });
  wrap.querySelectorAll('[data-toggle]').forEach(function (chk) {
    chk.onchange = function () {
      apiPost('toggleItem', { sheet: cfg.sheet, id: chk.dataset.toggle, value: chk.checked }).then(function (res) {
        if (!res || !res.ok) { chk.checked = !chk.checked; toast((res && res.error) || 'Update failed', true); }
        else toast('Updated');
      });
    };
  });
}

function openCrudModal(key, item) {
  const cfg = CRUD_CONFIG[key];
  const isEdit = !!item;
  openModal(isEdit ? 'Edit ' + cfg.label : 'Add ' + cfg.label, function (body) {
    body.innerHTML = cfg.fields.map(function (f) {
      if (f.type === 'image') return imageFieldHtml(f.key, f.label, item);
      if (f.type === 'textarea') return field(f.label, '<textarea id="f_' + f.key + '">' + esc(item ? item[f.key] : '') + '</textarea>');
      return field(f.label, '<input id="f_' + f.key + '" type="' + (f.type === 'number' ? 'number' : 'text') + '" value="' + esc(item ? item[f.key] : '') + '">');
    }).join('') + field('Display Order', '<input id="f_sortOrder" type="number" value="' + (item ? item.sortOrder : 0) + '">');
    wireImageFields(body, cfg.fields, item);

    body._getPayload = async function () {
      const payload = { id: item ? item.id : undefined, sortOrder: body.querySelector('#f_sortOrder').value };
      for (const f of cfg.fields) {
        if (f.type === 'image') {
          const result = await getImageFieldValue(body, f.key, item);
          if (result === null) return null; // validation failed inside helper
          payload[f.key] = result.url;
          payload[f.key + 'FileId'] = result.fileId;
        } else {
          payload[f.key] = body.querySelector('#f_' + f.key).value.trim();
        }
      }
      if (!payload.name && cfg.fields.some(function (f) { return f.key === 'name'; }) && !payload.name) { toast('Name is required', true); return null; }
      return payload;
    };
  }, async function () {
    const payload = await document.getElementById('modalBody')._getPayload();
    if (!payload) return false;
    const res = await apiPost('saveItem', { sheet: cfg.sheet, item: payload });
    if (res && res.ok) { toast('Saved'); await loadAdminData(); renderCrud(document.getElementById('viewContent'), key); return true; }
    toast((res && res.error) || 'Save failed', true); return false;
  });
}

/* ---- shared paste-link / upload-file image field, same pattern as school admin ---- */
function imageFieldHtml(key, label, item) {
  const url = item ? (item[key] || item.imageUrl || '') : '';
  return '<div class="field"><label>' + label + '</label><div class="upload-toggle">' +
    '<button type="button" class="active" data-mode-link="' + key + '">Paste Link</button>' +
    '<button type="button" data-mode-upload="' + key + '">Upload File</button></div>' +
    '<input id="f_' + key + '_link" placeholder="https://…" value="' + esc(url) + '">' +
    '<input id="f_' + key + '_file" type="file" accept="image/*" style="display:none;">' +
    '<div class="file-hint">Direct uploads are stored in Google Drive automatically. Max 4MB.</div>' +
    '<img id="f_' + key + '_preview" class="preview-img" src="' + esc(url) + '" style="' + (url ? 'display:block;' : '') + '"></div>';
}
function wireImageFields(body, fields, item) {
  fields.filter(function (f) { return f.type === 'image'; }).forEach(function (f) {
    const key = f.key;
    body._imgMode = body._imgMode || {};
    body._imgMode[key] = 'link';
    const linkBtn = body.querySelector('[data-mode-link="' + key + '"]');
    const uploadBtn = body.querySelector('[data-mode-upload="' + key + '"]');
    const linkInput = body.querySelector('#f_' + key + '_link');
    const fileInput = body.querySelector('#f_' + key + '_file');
    const preview = body.querySelector('#f_' + key + '_preview');
    function sync() {
      linkBtn.classList.toggle('active', body._imgMode[key] === 'link');
      uploadBtn.classList.toggle('active', body._imgMode[key] === 'upload');
      linkInput.style.display = body._imgMode[key] === 'link' ? 'block' : 'none';
      fileInput.style.display = body._imgMode[key] === 'upload' ? 'block' : 'none';
    }
    linkBtn.onclick = function () { body._imgMode[key] = 'link'; sync(); };
    uploadBtn.onclick = function () { body._imgMode[key] = 'upload'; sync(); };
    sync();
    linkInput.oninput = function () {
      const v = linkInput.value.trim();
      if (v) { preview.src = v; preview.style.display = 'block'; } else { preview.style.display = 'none'; }
    };
    fileInput.onchange = function () {
      const file = fileInput.files[0];
      if (file) { const r = new FileReader(); r.onload = function () { preview.src = r.result; preview.style.display = 'block'; }; r.readAsDataURL(file); }
    };
  });
}
async function getImageFieldValue(body, key, item) {
  const mode = (body._imgMode && body._imgMode[key]) || 'link';
  if (mode === 'link') {
    const url = body.querySelector('#f_' + key + '_link').value.trim();
    return { url: url, fileId: item ? (item[key + 'FileId'] || '') : '' };
  }
  const file = body.querySelector('#f_' + key + '_file').files[0];
  if (!file) {
    // keep existing value if editing and nothing new was chosen
    if (item) return { url: item[key] || item.imageUrl || '', fileId: item[key + 'FileId'] || '' };
    return { url: '', fileId: '' };
  }
  if (file.size > 4 * 1024 * 1024) { toast('Image exceeds 4MB limit', true); return null; }
  const base64 = await fileToBase64(file);
  const up = await apiPost('uploadFile', { base64: base64, mimeType: file.type, fileName: file.name });
  if (!up || !up.ok) { toast((up && up.error) || 'Upload failed', true); return null; }
  return { url: up.url, fileId: up.fileId };
}

/* =========================================================
   ENQUIRIES
   ========================================================= */
function renderEnquiries(c) {
  const rows = (ADMIN && ADMIN.enquiries) || [];
  if (!rows.length) { c.innerHTML = '<div class="panel"><div class="empty-row">No enquiries yet.</div></div>'; return; }
  c.innerHTML = '<div class="panel"><table><thead><tr><th>Name</th><th>Contact</th><th>Service</th><th>Message</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>' +
    rows.map(function (e) {
      return '<tr><td>' + esc(e.name) + '</td><td>' + esc(e.email) + '<br>' + esc(e.phone) + '</td><td>' + esc(e.service) + '</td>' +
        '<td style="max-width:220px;">' + esc(String(e.message).slice(0, 90)) + (String(e.message).length > 90 ? '…' : '') + '</td>' +
        '<td>' + fmtDate(e.date) + '</td>' +
        '<td><select data-status="' + e.id + '" class="badge-status" style="border:none;font-family:var(--mono);">' +
        ['new', 'read', 'responded'].map(function (s) { return '<option value="' + s + '"' + (e.status === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td>' +
        '<td class="row-actions"><button class="btn btn-sm btn-danger" data-del="' + e.id + '">Delete</button></td></tr>';
    }).join('') + '</tbody></table></div>';
  c.querySelectorAll('[data-status]').forEach(function (sel) {
    sel.onchange = function () { apiPost('updateEnquiryStatus', { id: sel.dataset.status, status: sel.value }).then(function () { toast('Status updated'); }); };
  });
  c.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = function () {
      if (!confirm('Delete this enquiry?')) return;
      apiPost('deleteEnquiry', { id: b.dataset.del }).then(function (res) {
        if (res && res.ok) { toast('Deleted'); loadAdminData().then(function () { renderEnquiries(document.getElementById('viewContent')); }); }
        else toast((res && res.error) || 'Delete failed', true);
      });
    };
  });
}

/* =========================================================
   SHARED MODAL + HELPERS
   ========================================================= */
function field(label, inputHtml) { return '<div class="field"><label>' + label + '</label>' + inputHtml + '</div>'; }

let currentSaveHandler = null;
function openModal(title, buildFn, saveFn) {
  document.getElementById('modalTitle').textContent = title;
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  buildFn(body);
  currentSaveHandler = saveFn;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); currentSaveHandler = null; }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalSave').onclick = async function () {
  if (!currentSaveHandler) return;
  const btn = this;
  btn.textContent = 'Saving…'; btn.disabled = true;
  const ok = await currentSaveHandler();
  btn.textContent = 'Save'; btn.disabled = false;
  if (ok) closeModal();
};
