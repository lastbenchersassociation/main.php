<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practice Coding Online by LBA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f4f3ff',
                            100: '#ebe9fe',
                            200: '#d9d6fe',
                            300: '#bdb4fe',
                            400: '#9b8afb',
                            500: '#7a5af8',
                            600: '#6331f6',
                            700: '#5423e0',
                            800: '#451cb9',
                            900: '#3a1997',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'JetBrains Mono', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbars for dark mode */
        .dark ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Custom scrollbars for light mode */
        html:not(.dark) ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        html:not(.dark) ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        html:not(.dark) ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        html:not(.dark) ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .code-textarea {
            tab-size: 2;
            -moz-tab-size: 2;
            white-space: pre;
            word-break: normal;
        }

        /* Prevent unwanted text selection during drag resizing */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Smooth preview container sizing transitions */
        .preview-frame-container {
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Mobile symbol key scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans h-screen w-screen overflow-hidden flex flex-col antialiased select-none transition-colors duration-200">

    <header class="h-14 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/90 backdrop-blur-md px-3 sm:px-4 flex items-center justify-between shrink-0 z-30 transition-colors duration-200">
        <!-- Logo & Branding -->
        <div class="flex items-center space-x-2.5">
            <div class="p-1.5 sm:p-2 bg-gradient-to-tr from-brand-600 to-indigo-500 rounded-xl shadow-md shadow-brand-500/20 text-white flex items-center justify-center">
                <i data-lucide="code-2" class="w-5 h-5 sm:w-6 sm:h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
                    <span>LBA Editor</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold border border-brand-500/20 hidden xs:inline-block"> Digital Empowerment</span>
                </h1>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 hidden md:block">Practice Coding Online by LBA</p>
            </div>
        </div>

        <!-- Desktop Mode Switcher & Quick Actions -->
        <div class="flex items-center space-x-2">
            <!-- Run Button -->
            <button id="btn-run" onclick="triggerUpdatePreview(true)" title="Run Code" class="flex items-center space-x-1 px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg shadow-sm transition active:scale-95">
                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                <span class="hidden sm:inline">Run</span>
            </button>

            <!-- Reset Code Button -->
            <button onclick="loadDefaultTemplate()" title="Reset to Starter Template" class="p-1.5 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>

            <!-- Layout Split/Tabs Buttons (Desktop >= 768px) -->
            <div class="hidden md:flex items-center bg-slate-100 dark:bg-slate-800/80 p-0.5 rounded-lg border border-slate-200 dark:border-slate-700/60">
                <button id="btn-mode-split" onclick="setDesktopLayout('split')" class="px-2 py-1 text-xs font-medium text-brand-600 dark:text-brand-400 bg-white dark:bg-slate-700 rounded shadow-xs" title="Split Screen Mode">
                    <i data-lucide="columns" class="w-3.5 h-3.5 inline mr-1"></i>Split
                </button>
                <button id="btn-mode-tabs" onclick="setDesktopLayout('tabs')" class="px-2 py-1 text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded transition" title="Single Active Panel">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5 inline mr-1"></i>Tabs
                </button>
            </div>

            <!-- Auto-Run Checkbox -->
            <label class="hidden lg:flex items-center space-x-1.5 text-xs text-slate-600 dark:text-slate-400 cursor-pointer bg-slate-100 dark:bg-slate-800/60 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/50">
                <input type="checkbox" id="auto-run-toggle" checked class="rounded border-slate-300 dark:border-slate-600 text-brand-600 focus:ring-brand-500 bg-white dark:bg-slate-900">
                <span>Auto Run</span>
            </label>

            <!-- Dark / Light Theme Toggle -->
            <button id="theme-toggle-btn" onclick="toggleTheme()" class="p-1.5 text-slate-600 hover:text-amber-500 dark:text-slate-400 dark:hover:text-amber-400 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-700 transition" title="Toggle Theme">
                <i data-lucide="sun" id="theme-icon-sun" class="w-4 h-4 hidden"></i>
                <i data-lucide="moon" id="theme-icon-moon" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Bottom/Top Segmented Navigation Control (<768px) -->
    <nav class="md:hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-1.5 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center w-full bg-slate-100 dark:bg-slate-950 p-1 rounded-xl border border-slate-200 dark:border-slate-800/80">
            <button onclick="setMobileView('html')" id="mob-nav-html" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 bg-white dark:bg-slate-800 text-orange-600 dark:text-orange-400 shadow-xs">
                <i data-lucide="file-code-2" class="w-3.5 h-3.5"></i>
                <span>HTML</span>
            </button>
            <button onclick="setMobileView('css')" id="mob-nav-css" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 text-slate-500 dark:text-slate-400">
                <i data-lucide="palette" class="w-3.5 h-3.5"></i>
                <span>CSS</span>
            </button>
            <button onclick="setMobileView('js')" id="mob-nav-js" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 text-slate-500 dark:text-slate-400">
                <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                <span>JS</span>
            </button>
            <button onclick="setMobileView('preview')" id="mob-nav-preview" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 text-slate-500 dark:text-slate-400">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span>Preview</span>
            </button>
        </div>
    </nav>

    <!-- Main Flexible Workspace Area -->
    <main id="workspace" class="flex-1 flex flex-col md:flex-row overflow-hidden relative min-h-0 w-full">

        <!-- EDITOR CONTAINER -->
        <section id="editor-section" class="w-full md:w-1/2 flex flex-col h-full overflow-hidden min-h-0 shrink-0 p-2 md:p-3 gap-2 border-r border-slate-200 dark:border-slate-800/80">

            <!-- Desktop Active Tab Indicator when in Tabbed Mode -->
            <div id="desktop-tab-bar" class="hidden md:flex items-center bg-slate-200/60 dark:bg-slate-900 p-1 rounded-xl border border-slate-300/50 dark:border-slate-800 shrink-0">
                <button onclick="setActiveTab('html')" id="tab-btn-html" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 bg-white dark:bg-slate-800 text-orange-600 dark:text-orange-400 shadow-xs">
                    <i data-lucide="file-code-2" class="w-3.5 h-3.5"></i>
                    <span>index.html</span>
                </button>
                <button onclick="setActiveTab('css')" id="tab-btn-css" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                    <i data-lucide="palette" class="w-3.5 h-3.5"></i>
                    <span>style.css</span>
                </button>
                <button onclick="setActiveTab('js')" id="tab-btn-js" class="flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                    <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                    <span>script.js</span>
                </button>
            </div>

            <!-- HTML Editor -->
            <div id="box-html" class="editor-box flex-1 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden shadow-xs min-h-0 transition-colors duration-200">
                <!-- Header -->
                <div class="h-8 px-3 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shrink-0 select-none">
                    <span class="flex items-center space-x-1.5 font-semibold text-orange-600 dark:text-orange-400">
                        <i data-lucide="file-code-2" class="w-3.5 h-3.5"></i>
                        <span>index.html</span>
                    </span>
                    <div class="flex items-center space-x-2">
                        <span id="lines-html" class="text-[10px] text-slate-400 dark:text-slate-500 font-mono">1 lines</span>
                        <button onclick="copySnippet('html')" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" title="Copy HTML">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
                <!-- Textarea Area -->
                <div class="flex-1 relative flex overflow-hidden min-h-0 font-mono text-xs">
                    <div id="gutter-html" class="py-2.5 px-2 bg-slate-100 dark:bg-slate-950/50 text-slate-400 dark:text-slate-600 text-right select-none border-r border-slate-200 dark:border-slate-800/60 w-9 shrink-0 overflow-hidden font-mono text-[11px]">1</div>
                    <textarea id="code-html" class="code-textarea flex-1 p-2.5 bg-transparent text-slate-800 dark:text-slate-200 resize-none focus:outline-none leading-relaxed overflow-auto select-text" spellcheck="false" placeholder="<!-- Write HTML here -->"></textarea>
                </div>
            </div>

            <!-- CSS Editor -->
            <div id="box-css" class="editor-box flex-1 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden shadow-xs min-h-0 transition-colors duration-200">
                <!-- Header -->
                <div class="h-8 px-3 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shrink-0 select-none">
                    <span class="flex items-center space-x-1.5 font-semibold text-sky-600 dark:text-sky-400">
                        <i data-lucide="palette" class="w-3.5 h-3.5"></i>
                        <span>style.css</span>
                    </span>
                    <div class="flex items-center space-x-2">
                        <span id="lines-css" class="text-[10px] text-slate-400 dark:text-slate-500 font-mono">1 lines</span>
                        <button onclick="copySnippet('css')" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" title="Copy CSS">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
                <!-- Textarea Area -->
                <div class="flex-1 relative flex overflow-hidden min-h-0 font-mono text-xs">
                    <div id="gutter-css" class="py-2.5 px-2 bg-slate-100 dark:bg-slate-950/50 text-slate-400 dark:text-slate-600 text-right select-none border-r border-slate-200 dark:border-slate-800/60 w-9 shrink-0 overflow-hidden font-mono text-[11px]">1</div>
                    <textarea id="code-css" class="code-textarea flex-1 p-2.5 bg-transparent text-slate-800 dark:text-slate-200 resize-none focus:outline-none leading-relaxed overflow-auto select-text" spellcheck="false" placeholder="/* Write CSS here */"></textarea>
                </div>
            </div>

            <!-- JS Editor -->
            <div id="box-js" class="editor-box flex-1 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden shadow-xs min-h-0 transition-colors duration-200">
                <!-- Header -->
                <div class="h-8 px-3 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shrink-0 select-none">
                    <span class="flex items-center space-x-1.5 font-semibold text-amber-600 dark:text-amber-400">
                        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                        <span>script.js</span>
                    </span>
                    <div class="flex items-center space-x-2">
                        <span id="lines-js" class="text-[10px] text-slate-400 dark:text-slate-500 font-mono">1 lines</span>
                        <button onclick="copySnippet('js')" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" title="Copy JS">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
                <!-- Textarea Area -->
                <div class="flex-1 relative flex overflow-hidden min-h-0 font-mono text-xs">
                    <div id="gutter-js" class="py-2.5 px-2 bg-slate-100 dark:bg-slate-950/50 text-slate-400 dark:text-slate-600 text-right select-none border-r border-slate-200 dark:border-slate-800/60 w-9 shrink-0 overflow-hidden font-mono text-[11px]">1</div>
                    <textarea id="code-js" class="code-textarea flex-1 p-2.5 bg-transparent text-slate-800 dark:text-slate-200 resize-none focus:outline-none leading-relaxed overflow-auto select-text" spellcheck="false" placeholder="// Write JS here"></textarea>
                </div>
            </div>

            <!-- Mobile Quick Symbol Bar -->
            <div id="mobile-symbol-bar" class="flex md:hidden items-center space-x-1 overflow-x-auto no-scrollbar bg-slate-200 dark:bg-slate-900 p-1 rounded-lg border border-slate-300/60 dark:border-slate-800 shrink-0">
                <button onclick="insertSymbol('<')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">&lt;</button>
                <button onclick="insertSymbol('>')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">&gt;</button>
                <button onclick="insertSymbol('/')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">/</button>
                <button onclick="insertSymbol('{')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">{</button>
                <button onclick="insertSymbol('}')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">}</button>
                <button onclick="insertSymbol('(')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">(</button>
                <button onclick="insertSymbol(')')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">)</button>
                <button onclick="insertSymbol(';')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">;</button>
                <button onclick="insertSymbol('=')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">=</button>
                <button onclick="insertSymbol('&quot;')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">"</button>
                <button onclick="insertSymbol('\'')" class="px-2.5 py-1 bg-white dark:bg-slate-800 hover:bg-slate-100 font-mono text-xs font-semibold rounded text-slate-700 dark:text-slate-200 shadow-2xs">'</button>
                <button onclick="insertSymbol('  ')" class="px-2 py-1 bg-brand-500/10 text-brand-600 dark:text-brand-400 font-mono text-xs font-semibold rounded shadow-2xs">Tab</button>
            </div>

        </section>

        <!-- Desktop Horizontal Drag Resizer Divider Handle -->
        <div id="drag-handle" class="hidden md:flex w-2 bg-slate-200 hover:bg-brand-500 dark:bg-slate-800 dark:hover:bg-brand-500 cursor-col-resize items-center justify-center shrink-0 z-20 transition-colors duration-150">
            <div class="w-1 h-8 bg-slate-400 dark:bg-slate-600 rounded-full"></div>
        </div>

        <!-- PREVIEW & CONSOLE CONTAINER -->
        <section id="preview-section" class="w-full md:w-1/2 flex flex-col h-full overflow-hidden min-h-0 shrink-0 p-2 md:p-3 gap-2">

            <!-- Live Preview Card Box -->
            <div class="flex-1 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden shadow-xs min-h-0 transition-colors duration-200">
                <!-- Preview Toolbar -->
                <div class="h-9 px-3 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shrink-0 select-none">
                    <div class="flex items-center space-x-1.5">
                        <div class="w-2.5 h-2.5 rounded-full bg-rose-500"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                        <span class="font-medium text-slate-600 dark:text-slate-300 ml-1">Live Output</span>
                    </div>

                    <!-- Desktop Frame Bounds Selector -->
                    <div class="hidden sm:flex items-center space-x-1 bg-slate-200/80 dark:bg-slate-950 p-0.5 rounded-lg border border-slate-300/50 dark:border-slate-800">
                        <button onclick="setViewport('responsive')" id="device-responsive" class="px-2 py-0.5 text-[11px] text-brand-600 dark:text-brand-400 bg-white dark:bg-slate-800 rounded font-medium shadow-2xs">Full</button>
                        <button onclick="setViewport('tablet')" id="device-tablet" class="px-2 py-0.5 text-[11px] text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 rounded">Tablet</button>
                        <button onclick="setViewport('mobile')" id="device-mobile" class="px-2 py-0.5 text-[11px] text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 rounded">Mobile</button>
                    </div>

                    <div class="flex items-center space-x-1">
                        <button onclick="reloadPreviewFrame()" class="p-1 text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 rounded" title="Reload Preview">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="openPreviewNewTab()" class="p-1 text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 rounded" title="Open Popout">
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <!-- Frame Viewport Outer Container -->
                <div class="flex-1 bg-slate-100 dark:bg-slate-950/80 flex justify-center items-center overflow-hidden p-1 sm:p-2 relative min-h-0">
                    <div id="preview-frame-container" class="preview-frame-container w-full h-full bg-white rounded-lg overflow-hidden shadow-sm relative border border-slate-200 dark:border-slate-800">
                        <iframe id="preview-frame" class="w-full h-full border-none bg-white" sandbox="allow-scripts allow-modals allow-forms"></iframe>
                    </div>
                </div>
            </div>

            <!-- Console Log Drawer Container -->
            <div id="console-drawer" class="h-28 sm:h-32 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden shadow-xs shrink-0 transition-colors duration-200">
                <!-- Bar -->
                <div class="h-7 px-3 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shrink-0 select-none">
                    <div class="flex items-center space-x-1.5 font-semibold text-slate-700 dark:text-slate-300 text-[11px]">
                        <i data-lucide="terminal" class="w-3.5 h-3.5 text-brand-600 dark:text-brand-400"></i>
                        <span>Console Output</span>
                        <span id="console-badge" class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-mono">0</span>
                    </div>
                    <button onclick="clearConsoleLog()" class="text-[11px] text-slate-400 hover:text-rose-500 transition">Clear</button>
                </div>
                <!-- Console Stream List -->
                <div id="console-logs" class="flex-1 p-2 font-mono text-[11px] overflow-y-auto space-y-1 bg-slate-50 dark:bg-slate-950/90 text-slate-800 dark:text-slate-300 min-h-0">
                    <div class="text-slate-400 dark:text-slate-500 italic text-[11px]">Console ready...</div>
                </div>
            </div>

        </section>

    </main>

    <!-- Notification Toast Floating Message -->
    <div id="toast" class="fixed bottom-4 right-4 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2 bg-slate-900 dark:bg-slate-800 text-white px-3.5 py-2.5 rounded-xl shadow-xl z-50 text-xs">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400" id="toast-icon"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <script>
        // --- Core Application State ---
        const state = {
            theme: 'dark',
            desktopLayout: 'split', // 'split' or 'tabs'
            activeTab: 'html', // 'html', 'css', 'js'
            mobileView: 'html', // 'html', 'css', 'js', 'preview'
            viewport: 'responsive',
            autoRun: true,
            logsCount: 0,
            updateTimer: null,
            lastFocusedInput: 'code-html'
        };

        // --- Starter Code ---
        const defaultCode = {
            html: `<div class="card">
  <div class="badge">LBA Live</div>
  <h2>Practice Coding</h2>
  <p>Modify HTML, CSS, and JS code in real-time. Full responsive preview & console!</p>
  <button id="click-btn">Tap Me <span id="cnt">0</span></button>
</div>`,
            css: `body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f172a;
  font-family: system-ui, sans-serif;
  color: #f8fafc;
  padding: 16px;
}
.card {
  background: #1e293b;
  padding: 24px;
  border-radius: 20px;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
}
.badge {
  display: inline-block;
  padding: 4px 10px;
  background: rgba(99, 49, 246, 0.2);
  color: #9b8afb;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 12px;
}
h2 { margin: 0 0 8px; font-size: 1.25rem; }
p { color: #94a3b8; font-size: 0.85rem; line-height: 1.4; margin-bottom: 18px; }
button {
  background: #6331f6;
  color: white;
  border: none;
  padding: 10px 20px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex;
  gap: 8px;
}
button:hover { background: #5423e0; }`,
            js: `let count = 0;
const btn = document.getElementById('click-btn');
const cnt = document.getElementById('cnt');

btn.addEventListener('click', () => {
  count++;
  cnt.textContent = count;
  console.log('Button tapped:', count);
});

console.log('Starter script loaded!');`
        };

        // --- DOM Elements ---
        const htmlInput = document.getElementById('code-html');
        const cssInput = document.getElementById('code-css');
        const jsInput = document.getElementById('code-js');
        const previewFrame = document.getElementById('preview-frame');
        const consoleLogsDiv = document.getElementById('console-logs');

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            // Load persistent theme or default dark
            const savedTheme = localStorage.getItem('LBA_theme') || 'dark';
            applyTheme(savedTheme);

            lucide.createIcons();
            loadDefaultTemplate();
            setupTextareaSync();
            setupConsoleInterception();
            setupDragResizer();

            // Auto-run checkbox binding
            document.getElementById('auto-run-toggle').addEventListener('change', (e) => {
                state.autoRun = e.target.checked;
            });

            // Track last focused textarea for mobile symbol bar insertion
            ['html', 'css', 'js'].forEach(t => {
                const el = document.getElementById(`code-${t}`);
                el.addEventListener('focus', () => state.lastFocusedInput = `code-${t}`);
            });

            // Handle responsive view shifts on screen resize
            window.addEventListener('resize', handleResize);
            handleResize();
        });

        // --- STREAMING_CHUNK:Theme & Screen Layout Functions... ---
        function applyTheme(targetTheme) {
            state.theme = targetTheme;
            const htmlEl = document.documentElement;
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');

            if (targetTheme === 'dark') {
                htmlEl.classList.add('dark');
                if (sunIcon) sunIcon.classList.add('hidden');
                if (moonIcon) moonIcon.classList.remove('hidden');
            } else {
                htmlEl.classList.remove('dark');
                if (sunIcon) sunIcon.classList.remove('hidden');
                if (moonIcon) moonIcon.classList.add('hidden');
            }
            localStorage.setItem('LBA_theme', targetTheme);
        }

        function toggleTheme() {
            const nextTheme = state.theme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
            showToast(`${nextTheme === 'dark' ? 'Dark' : 'Light'} theme enabled`);
        }

        // --- Handle Responsive Screen Resize Transitions ---
        function handleResize() {
            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                setMobileView(state.mobileView);
            } else {
                setDesktopLayout(state.desktopLayout);
            }
        }

        // --- Mobile View Switching (<768px) ---
        function setMobileView(view) {
            state.mobileView = view;
            const editorSection = document.getElementById('editor-section');
            const previewSection = document.getElementById('preview-section');
            const dragHandle = document.getElementById('drag-handle');
            const mobileSymbolBar = document.getElementById('mobile-symbol-bar');

            if (dragHandle) dragHandle.classList.add('hidden');

            // Update mobile bar buttons highlight
            ['html', 'css', 'js', 'preview'].forEach(v => {
                const btn = document.getElementById(`mob-nav-${v}`);
                if (v === view) {
                    btn.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-xs";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 text-slate-500 dark:text-slate-400";
                }
            });

            if (view === 'preview') {
                editorSection.classList.add('hidden');
                previewSection.classList.remove('hidden');
                previewSection.style.width = '100%';
            } else {
                previewSection.classList.add('hidden');
                editorSection.classList.remove('hidden');
                editorSection.style.width = '100%';
                if (mobileSymbolBar) mobileSymbolBar.classList.remove('hidden');

                // Show only active single code box on mobile
                ['html', 'css', 'js'].forEach(boxKey => {
                    const box = document.getElementById(`box-${boxKey}`);
                    if (boxKey === view) {
                        box.classList.remove('hidden');
                    } else {
                        box.classList.add('hidden');
                    }
                });
            }
        }

        // --- Desktop Layout Switching (>=768px) ---
        function setDesktopLayout(mode) {
            state.desktopLayout = mode;
            const isMobile = window.innerWidth < 768;
            if (isMobile) return;

            const editorSection = document.getElementById('editor-section');
            const previewSection = document.getElementById('preview-section');
            const desktopTabBar = document.getElementById('desktop-tab-bar');
            const dragHandle = document.getElementById('drag-handle');

            // Reset width flex split
            editorSection.classList.remove('hidden');
            previewSection.classList.remove('hidden');
            editorSection.style.width = '50%';
            previewSection.style.width = '50%';
            if (dragHandle) dragHandle.classList.remove('hidden');

            // Update desktop mode buttons
            const btnSplit = document.getElementById('btn-mode-split');
            const btnTabs = document.getElementById('btn-mode-tabs');

            if (mode === 'split') {
                btnSplit.className = "px-2 py-1 text-xs font-medium text-brand-600 dark:text-brand-400 bg-white dark:bg-slate-700 rounded shadow-xs";
                btnTabs.className = "px-2 py-1 text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded transition";
                desktopTabBar.classList.add('hidden');
                ['html', 'css', 'js'].forEach(b => document.getElementById(`box-${b}`).classList.remove('hidden'));
            } else {
                btnTabs.className = "px-2 py-1 text-xs font-medium text-brand-600 dark:text-brand-400 bg-white dark:bg-slate-700 rounded shadow-xs";
                btnSplit.className = "px-2 py-1 text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white rounded transition";
                desktopTabBar.classList.remove('hidden');
                setActiveTab(state.activeTab);
            }
        }

        function setActiveTab(tab) {
            state.activeTab = tab;
            ['html', 'css', 'js'].forEach(t => {
                const box = document.getElementById(`box-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    box.classList.remove('hidden');
                    btn.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-xs";
                } else {
                    box.classList.add('hidden');
                    btn.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
                }
            });
        }

        // --- STREAMING_CHUNK:Draggable Pane Handle Implementation... ---
        function setupDragResizer() {
            const handle = document.getElementById('drag-handle');
            const editorSec = document.getElementById('editor-section');
            const previewSec = document.getElementById('preview-section');
            const workspace = document.getElementById('workspace');

            if (!handle) return;

            let isDragging = false;

            const onStart = (e) => {
                if (window.innerWidth < 768) return;
                isDragging = true;
                document.body.classList.add('no-select');
            };

            const onMove = (e) => {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const rect = workspace.getBoundingClientRect();
                const offset = clientX - rect.left;
                const totalWidth = rect.width;

                let percentage = (offset / totalWidth) * 100;
                if (percentage < 20) percentage = 20;
                if (percentage > 80) percentage = 80;

                editorSec.style.width = `${percentage}%`;
                previewSec.style.width = `${100 - percentage}%`;
            };

            const onEnd = () => {
                isDragging = false;
                document.body.classList.remove('no-select');
            };

            handle.addEventListener('mousedown', onStart);
            handle.addEventListener('touchstart', onStart, { passive: true });

            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: true });

            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        }

        // --- Insert Mobile Helper Symbols ---
        function insertSymbol(symbol) {
            const textarea = document.getElementById(state.lastFocusedInput) || htmlInput;
            textarea.focus();
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;

            textarea.value = textarea.value.substring(0, start) + symbol + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + symbol.length;

            const type = state.lastFocusedInput.replace('code-', '');
            updateGutter(type);
            if (state.autoRun) debouncedUpdatePreview();
        }

        // --- Editor Gutter & Tab Indentation ---
        function setupTextareaSync() {
            ['html', 'css', 'js'].forEach(type => {
                const textarea = document.getElementById(`code-${type}`);
                
                textarea.addEventListener('input', () => {
                    updateGutter(type);
                    if (state.autoRun) debouncedUpdatePreview();
                });

                textarea.addEventListener('scroll', () => {
                    const gutter = document.getElementById(`gutter-${type}`);
                    gutter.scrollTop = textarea.scrollTop;
                });

                textarea.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        insertSymbol('  ');
                    }
                });
            });
        }

        function updateGutter(type) {
            const textarea = document.getElementById(`code-${type}`);
            const gutter = document.getElementById(`gutter-${type}`);
            const lineBadge = document.getElementById(`lines-${type}`);
            const lines = textarea.value.split('\n').length;
            
            let lineNums = '';
            for (let i = 1; i <= lines; i++) lineNums += i + '<br>';
            gutter.innerHTML = lineNums;
            lineBadge.textContent = `${lines} ${lines === 1 ? 'line' : 'lines'}`;
        }

        function updateAllGutters() {
            updateGutter('html');
            updateGutter('css');
            updateGutter('js');
        }

        // --- STREAMING_CHUNK:Live Execution & Frame Controls... ---
        function debouncedUpdatePreview() {
            clearTimeout(state.updateTimer);
            state.updateTimer = setTimeout(() => {
                triggerUpdatePreview();
            }, 350);
        }

        function triggerUpdatePreview(clearConsole = false) {
            if (clearConsole) clearConsoleLog();

            const html = htmlInput.value;
            const css = cssInput.value;
            const js = jsInput.value;

            const consoleInterceptorScript = `
                <script>
                    (function() {
                        function sendMessage(type, args) {
                            try {
                                const parsedArgs = Array.from(args).map(arg => {
                                    if (typeof arg === 'object') return JSON.stringify(arg);
                                    return String(arg);
                                }).join(' ');
                                window.parent.postMessage({ type: 'CONSOLE_LOG', level: type, msg: parsedArgs }, '*');
                            } catch(e) {}
                        }
                        const _log = console.log, _error = console.error, _warn = console.warn;
                        console.log = function(...args) { sendMessage('log', args); _log.apply(console, args); };
                        console.error = function(...args) { sendMessage('error', args); _error.apply(console, args); };
                        console.warn = function(...args) { sendMessage('warn', args); _warn.apply(console, args); };
                        window.onerror = function(msg, url, line) {
                            sendMessage('error', [\`Error: \${msg} (Line \${line})\`]);
                        };
                    })();
                <\/script>
            `;

            const fullContent = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>${css}</style>
                </head>
                <body>
                    ${html}
                    ${consoleInterceptorScript}
                    <script>${js}<\/script>
                </body>
                </html>
            `;

            previewFrame.srcdoc = fullContent;
        }

        function reloadPreviewFrame() {
            triggerUpdatePreview(true);
            showToast('Preview frame reloaded');
        }

        function openPreviewNewTab() {
            const html = htmlInput.value;
            const css = cssInput.value;
            const js = jsInput.value;
            const win = window.open();
            if (win) {
                win.document.write(`<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`);
                win.document.close();
            }
        }

        // --- Console Log Interception ---
        function setupConsoleInterception() {
            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'CONSOLE_LOG') {
                    appendConsoleEntry(e.data.level, e.data.msg);
                }
            });
        }

        function appendConsoleEntry(level, msg) {
            if (state.logsCount === 0) consoleLogsDiv.innerHTML = '';
            state.logsCount++;
            document.getElementById('console-badge').textContent = state.logsCount;

            const entry = document.createElement('div');
            entry.className = 'flex items-start space-x-1.5 py-0.5 border-b border-slate-200/50 dark:border-slate-800/40 font-mono text-[11px]';

            let iconColor = 'text-sky-500';
            let textColor = 'text-slate-800 dark:text-slate-200';

            if (level === 'error') {
                iconColor = 'text-rose-500';
                textColor = 'text-rose-600 dark:text-rose-400';
            } else if (level === 'warn') {
                iconColor = 'text-amber-500';
                textColor = 'text-amber-600 dark:text-amber-300';
            }

            entry.innerHTML = `<span class="${iconColor} shrink-0">❯</span><span class="${textColor} break-all">${escapeHtml(msg)}</span>`;
            consoleLogsDiv.appendChild(entry);
            consoleLogsDiv.scrollTop = consoleLogsDiv.scrollHeight;
        }

        function clearConsoleLog() {
            state.logsCount = 0;
            document.getElementById('console-badge').textContent = '0';
            consoleLogsDiv.innerHTML = `<div class="text-slate-400 dark:text-slate-500 italic text-[11px]">Console ready...</div>`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- Template Reset & Helper Actions ---
        function loadDefaultTemplate() {
            htmlInput.value = defaultCode.html;
            cssInput.value = defaultCode.css;
            jsInput.value = defaultCode.js;
            updateAllGutters();
            triggerUpdatePreview(true);
            showToast('Starter template loaded');
        }

        function copySnippet(type) {
            const text = document.getElementById(`code-${type}`).value;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast(`${type.toUpperCase()} code copied!`);
        }

        function setViewport(mode) {
            const container = document.getElementById('preview-frame-container');
            ['responsive', 'tablet', 'mobile'].forEach(m => {
                const btn = document.getElementById(`device-${m}`);
                if (m === mode) {
                    btn.className = "px-2 py-0.5 text-[11px] text-brand-600 dark:text-brand-400 bg-white dark:bg-slate-800 rounded font-medium shadow-2xs";
                } else {
                    btn.className = "px-2 py-0.5 text-[11px] text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 rounded";
                }
            });

            if (mode === 'responsive') container.style.width = '100%';
            else if (mode === 'tablet') container.style.width = '768px';
            else if (mode === 'mobile') container.style.width = '375px';
            state.viewport = mode;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
